name: Mini App visual acceptance

on:
  push:
    paths:
      - 'cloudflare/public/**'
      - 'scripts/editorial_preview.py'
      - 'scripts/visual_qa.mjs'
      - '.github/workflows/visual-qa.yml'
  pull_request:
    paths:
      - 'cloudflare/public/**'
      - 'scripts/editorial_preview.py'
      - 'scripts/visual_qa.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-qa:
    name: Mobile and desktop synthetic catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select installed headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v "$browser")" >> "$GITHUB_ENV"
              "$browser" --version
              exit 0
            fi
          done
          echo 'No headless Chrome executable on the runner' >&2
          exit 1

      - name: Check frontend syntax
        run: node --check cloudflare/public/app.js

      - name: Start isolated synthetic preview and verify mutation guard
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/editorial_preview.py 8769 > "$RUNNER_TEMP/atelier-preview.log" 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8769/api/catalog"
          for _ in range(70):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      data = json.load(response)
                  assert data["ok"] is True and len(data["products"]) == 3
                  break
              except (OSError, ValueError):
                  time.sleep(0.1)
          else:
              raise SystemExit("Synthetic catalogue failed to start")

          request = urllib.request.Request(
              "http://127.0.0.1:8769/api/checkout",
              data=b"{}",
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=3)
          except urllib.error.HTTPError as error:
              assert error.code == 403, f"Unexpected mutation status {error.code}"
          else:
              raise SystemExit("Synthetic fixture unexpectedly allowed a checkout")
          print("Fixture: 3 synthetic products; remote writes disabled")
          PY

      - name: Test five responsive viewports and CTA interaction
        env:
          PREVIEW_URL: http://127.0.0.1:8769/app
        run: node scripts/visual_qa.mjs

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-visual-qa
          path: |
            out/visual-qa/
            ${{ runner.temp }}/atelier-preview.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop only this workflow's preview process
        if: always()
        shell: bash
        run: |
          if [[ -n "${PREVIEW_PID:-}" ]]; then
            kill "$PREVIEW_PID" 2>/dev/null || true
          fi
